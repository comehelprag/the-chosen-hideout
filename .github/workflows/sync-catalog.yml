name: Sync Proton catalog

on:
  schedule:
    # todo dia às 05:00 UTC (02:00 em Brasília)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Rebuild catalog from the Proton share
        run: python tools/sync_share.py

      - name: Commit if the catalog changed
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Nada mudou no Drive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore(catalog): sync Proton share"
          git push

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-debug
          path: tools/.debug/
          if-no-files-found: ignore
          retention-days: 7
